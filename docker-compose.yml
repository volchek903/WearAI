services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/wearai.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./_generated:/app/_generated
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/wearai.db
      GENERATED_DIR: /app/_generated
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./_generated:/app/_generated
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
